server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page App fallback:
    # If a requested file/directory isn't found (e.g. /posts/1 on refresh),
    # serve index.html so React Router can handle the route on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively (filenames change on each build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Basic gzip compression for faster loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
